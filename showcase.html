<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="我的前端作品集：菜单搜索、答题小游戏、用户注册页">
    <title>前端作品展示集</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- 头部 -->
        <div class="header">
            <h1>我的前端作品集</h1>
            <p>包含菜单搜索、答题小游戏与用户注册页</p>
        </div>

        <!-- 作品网格 -->
        <div class="grid">
            <!-- 作品1：菜单搜索 -->
            <div class="card">
                <div class="card-img">
                    <img src="./picture/menu.png" alt="菜单搜索截图" loading="lazy">
                </div>
                <div class="card-content">
                    <div class="card-title">菜单搜索 (Menu)</div>
                    <div class="card-desc">前端搜索与展示功能实践</div>
                    <a href="https://menu-search-rho.vercel.app/" target="_blank" class="btn">访问作品</a>
                </div>
            </div>

            <!-- 作品2：答题小游戏 -->
            <div class="card">
                <div class="card-img">
                    <img src="./picture/quiz-page.png" alt="答题小游戏截图" loading="lazy">
                </div>
                <div class="card-content">
                    <div class="card-title">答题小游戏 (Quiz)</div>
                    <div class="card-desc">HTML知识互动问答页面</div>
                    <a href="https://quiz-game-jade.vercel.app/" target="_blank" class="btn">访问作品</a>
                </div>
            </div>

            <!-- 作品3：用户注册页 -->
            <div class="card">
                <div class="card-img">
                    <img src="./picture/register-page.png" alt="用户注册页截图" loading="lazy">
                </div>
                <div class="card-content">
                    <div class="card-title">用户注册页 (Register)</div>
                    <div class="card-desc">表单校验与UI布局练习</div>
                    <a href="https://register-page-gamma-smoky.vercel.app/" target="_blank" class="btn">访问作品</a>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
